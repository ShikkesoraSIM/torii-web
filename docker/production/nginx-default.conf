# nginx del CONTENEDOR de osu-web, variante de produccion.
#
# Sale de docker/development/nginx-default.conf con tres cambios. No se puede
# usar el de development tal cual:
#
#  1. El server de listen 8008 (lineas 114-132 del original) apunta a php-dusk y
#     notification-server-dusk. En prod esos servicios no se levantan, y nginx
#     resuelve los upstream literales al cargar la config: si un nombre no
#     resuelve aborta el arranque entero. Verificado:
#       nginx: [emerg] host not found in upstream "..." in
#       /etc/nginx/conf.d/default.conf
#     O sea: dejar ese bloque y sacar los servicios dusk = nginx no bootea.
#     Se elimina.
#
#  2. El X-Forwarded-For de nivel http era $remote_addr, que PISA la cadena que
#     mandan Caddy y el nginx del host. Detras de dos proxies, $remote_addr aca
#     es el gateway de la bridge de compose, asi que Laravel veria una sola ip
#     para todos los usuarios (rompe rate limiting, bans y moderacion). Se
#     arregla solo en las locations que van a php, para no filtrarle la ip real
#     del usuario a assets.ppy.sh en los proxies de imagenes de abajo.
#
#  3. Se agrega X-Forwarded-Proto https hacia php. Va hardcodeado porque la
#     unica via de entrada es Caddy(443) -> nginx del host -> este contenedor.
#
# Todo el bloque torii de proxeo de imagenes queda IGUAL. Matchea por path
# (/uploads/...), y esos paths no cambian cuando APP_URL pasa de localhost al
# dominio real: config/filesystems.php arma base_url como "{APP_URL}/uploads/x",
# o sea que cambia el origen y el path se mantiene.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# torii: ipv6=off no es opcional. El bloque de imagenes de abajo usa proxy_pass
# con variables, que es lo unico que ejercita este resolver, y assets.ppy.sh
# tiene AAAA mientras que el contenedor no tiene ruta v6.
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;

root /app/public;

proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_http_version 1.1;

client_max_body_size 32m;

server {
    listen 80 default_server;

    # ------------------------------------------------------- torii, seguridad --
    #
    # Los 28 endpoints /_lio/* son la interoperabilidad con el osu! legacy: se
    # autentican firmando la url con HMAC contra SHARED_INTEROP_SECRET, y entre
    # ellos hay endpoints que dan cualquier grupo (incluido admin), borran teams
    # y beatmapsets, crean usuarios y matan sesiones.
    #
    # En prod el secreto SI esta seteado, o sea que la firma no es forjable. Pero
    # aca no hay ningun servicio legacy que los llame, asi que se cierran igual:
    # una superficie que nadie usa y que da admin no tiene por que estar abierta.
    location ^~ /_lio/ {
        return 404;
    }

    # ------------------------------------------------------------------ torii --
    # osu-web arma las urls de imagen como base_url del disco local mas el id,
    # o sea que todo cae bajo /uploads/. Los archivos no estan aca: los de mapas
    # de ppy viven en su cdn y los propios de Torii en su api. Se interceptan y
    # se proxean, sin tocar php ni la config de laravel.

    # portadas de beatmapset. El layout de path de osu-web es igual al del cdn de
    # ppy y 108.602 de los 108.665 sets tienen id real de ppy. Los 63 que no,
    # son subidas a Torii y se reintentan contra su api.
    location ~ ^/uploads/default/beatmaps/(?<torii_cover>[0-9]+/covers/[^/]+\.jpg)$ {
        proxy_ssl_server_name on;
        proxy_set_header Host assets.ppy.sh;
        # Caddy le mete X-Forwarded-Host a todo lo que proxea, y el edge de ppy
        # rutea por ese header ANTES que por Host. Con un valor que no conoce cae
        # al vhost de avatares y contesta 200 con la cara gris de invitado (png de
        # 2343 bytes) para CUALQUIER path, asi que no cargaba ni una portada. Y
        # como es 200 y no 404, el error_page de abajo no tenia nada que
        # interceptar: el mismo bug se tapaba su propio fallback y los sets
        # subidos a Torii tampoco se pedian nunca.
        #
        # Seteado a "" nginx OMITE el header, que es lo que queremos. Mandarlo
        # vacio de verdad da 400.
        #
        # XFF y XFProto van por lo mismo y de paso cumplen lo que promete el
        # comentario de arriba: hoy la ip real del usuario le llega igual a ppy,
        # porque la pone Caddy y esta location no la estaba pisando.
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_intercept_errors on;
        proxy_pass https://assets.ppy.sh/beatmaps/$torii_cover;
        error_page 404 403 = @torii_local_cover;
    }

    # Si tampoco esta en Torii queda el degradado y esta bien: la portada se
    # pinta en un ::before, asi que el 404 degrada solo.
    location @torii_local_cover {
        proxy_ssl_server_name on;
        proxy_set_header Host lazer-api.shikkesora.com;
        proxy_hide_header Content-Disposition;
        proxy_pass https://lazer-api.shikkesora.com/file/beatmapsets/$torii_cover;
    }

    location ~ ^/uploads/default/teams/flag/[0-9]+/(?<torii_teamflag>[^/]+)$ {
        proxy_ssl_server_name on;
        proxy_set_header Host lazer-api.shikkesora.com;
        proxy_hide_header Content-Disposition;
        proxy_pass https://lazer-api.shikkesora.com/file/team_flag/$torii_teamflag;
    }

    location ~ ^/uploads/default/teams/header/[0-9]+/(?<torii_teamhdr>[^/]+)$ {
        proxy_ssl_server_name on;
        proxy_set_header Host lazer-api.shikkesora.com;
        proxy_hide_header Content-Disposition;
        proxy_pass https://lazer-api.shikkesora.com/file/team_cover/$torii_teamhdr;
    }

    location ~ ^/uploads/default/user-profile-covers/[0-9]+/(?<torii_usercover>[^/]+)$ {
        proxy_ssl_server_name on;
        proxy_set_header Host lazer-api.shikkesora.com;
        proxy_hide_header Content-Disposition;
        proxy_pass https://lazer-api.shikkesora.com/file/cover/$torii_usercover;
    }

    # Avatares. AvatarHelper::url() cambia el guion bajo del nombre por un signo
    # de pregunta, asi que "3_a86f.png" llega partido en path 3 y query a86f.png.
    # Se vuelve a pegar. $args va explicito porque con variables en proxy_pass
    # nginx manda la uri tal cual y no appendea la query solo.
    location ~ ^/uploads/avatar/(?<torii_uid>[0-9]+)$ {
        proxy_ssl_server_name on;
        proxy_set_header Host lazer-api.shikkesora.com;
        proxy_hide_header Content-Disposition;
        proxy_pass https://lazer-api.shikkesora.com/file/avatars/${torii_uid}_$args;
    }

    # El preset de portada que siembra osu-web es un jpeg negro de 2000x500. Se
    # pisa aca en vez de desactivarlo en la base: es la unica fila de
    # user_cover_presets y sin filas activas se queda sin opciones el selector de
    # portada de la configuracion de cuenta.
    location = /uploads/default/user-cover-presets/1/b7896c39893437c06747a9e74490f407298ab67983fba39a273bebf68540ceee.jpeg {
        proxy_ssl_server_name on;
        proxy_set_header Host assets.ppy.sh;
        # Misma historia que las portadas: sin esto ppy contesta la cara gris.
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_pass https://assets.ppy.sh/beatmaps/1/covers/cover@2x.jpg;
    }
    # -------------------------------------------------------------- fin torii --

    location / {
        try_files $uri @octane;
    }

    location /assets/images/flags/ {
        error_page 404 /images/flags/fallback.png;
    }

    location = /home/notifications/feed {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
        proxy_pass http://notification-server:2345;
    }

    location @octane {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://php:8000;
    }
}
