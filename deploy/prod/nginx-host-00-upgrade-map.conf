# Va en /etc/nginx/conf.d/00-upgrade-map.conf del HOST (no del contenedor).
#
# El nginx del host no tiene ningun map $http_upgrade definido (verificado:
# grep -rn "connection_upgrade" /etc/nginx/ no devuelve nada). Los sitios que ya
# existen hardcodean Connection "upgrade" en todos los requests, que rompe el
# keep-alive contra el upstream. Para osu-web se usa el map, que manda "upgrade"
# solo cuando el cliente pidio upgrade y "close" en el resto.
#
# conf.d se incluye ANTES de sites-enabled (nginx.conf lineas 59 y 60), asi que
# la variable ya existe cuando se parsea el sitio de torii-web.
#
# Este archivo es aditivo: no toca ninguno de los 4 sitios que ya estan.

map $http_upgrade $torii_connection_upgrade {
    default upgrade;
    ''      close;
}
