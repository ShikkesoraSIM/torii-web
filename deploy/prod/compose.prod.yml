# Override de PRODUCCION para el stack de osu-web en torii-eu.
#
#   docker compose -f compose.yaml -f deploy/prod/compose.prod.yml up -d
#
# NUNCA sin los -f explicitos: sin ellos compose toma compose.override.yml, que
# es el de la maquina local y trae TORII_SKIP_SESSION_VERIFICATION prendido.
#
# OJO con /app: aca NO se usa el volumen app-code. Ese es el workaround del bind
# mount de Windows, donde php tarda 430 veces mas en abrir cada archivo. En Linux
# el bind mount es a velocidad nativa, asi que se hereda el `.:/app` de
# compose.yaml y desplegar vuelve a ser lo de siempre: commit, push, pull,
# restart. Con el volumen habria que empujar los archivos adentro en cada deploy.

services:
  # ------------------------------------------------------------ base de datos --
  #
  # osu-web NO usa su propio mysql en prod: usa el de g0v0.
  #
  # No es una optimizacion, es la unica forma de que las vistas existan. Una
  # vista de MySQL no cruza servidores, y las 25 tablas que osu-web comparte con
  # el juego son vistas sobre osu_api. Con un mysqld propio volveriamos a copiar
  # datos y a mostrar la foto de hace un rato.
  #
  # El aislamiento va en el usuario y no en la red: toriiweb tiene
  # MAX_USER_CONNECTIONS 40 y sobre osu_api solo SELECT/INSERT/UPDATE/DELETE, sin
  # DROP, sin ALTER y sin LOCK TABLES. El riesgo real para el submit de scores
  # nunca fue la cpu (el mysqld esta al 0.26%), es que la web se coma las
  # conexiones o deje una consulta agarrando recursos: eso ya paso con el txn
  # leak de g0v0 que reventaba el Ban.
  db:
    profiles: ["apagado"]

  # -------------------------------------------------------------- migraciones --
  #
  # Apagado, y no es opcional. Corre `artisan migrate` en cada `up`, y 25 de las
  # tablas que quiere migrar son VISTAS. Un ALTER sobre una vista no falla
  # prolijo. En local zafa de casualidad porque APP_ENV=production le hace pedir
  # confirmacion y se cancela solo.
  #
  # Cuando ppy agrega una columna el camino es a mano y con las vistas
  # revertidas: ver "Cuando ppy agrega una columna" en TORII-README.md.
  migrator:
    profiles: ["apagado"]

  # ------------------------------------------------------ indexador de scores --
  #
  # Apagado. Arranca con SCHEMA=1, crea un indice scores_1 VACIO, se roba el
  # alias `scores` (de donde la web lee todo lo que pasa por elasticsearch) y
  # despues solo escucha la cola de scores nuevos: nunca hace backfill.
  #
  # Con el alias en un indice vacio la web no se cae, MIENTE: todos los
  # leaderboards de mapas vacios, todos los Best Performance vacios, y cada
  # score diciendo que es #1 del mundo, porque el rank es "1 + cuantos te ganan"
  # y sobre cero eso da 1 siempre.
  #
  # Los scores los indexa torii-index-scores.php, aca abajo.
  score-indexer:
    profiles: ["apagado"]

  score-indexer-test:
    profiles: ["apagado"]

  # El nuestro, que si hace backfill. Antes iba por cron cada cinco minutos y el
  # atraso era ese: metias una play y tardaba hasta cinco minutos en aparecer en
  # el leaderboard del mapa y en tu Best Performance. La base no tiene ese
  # problema (la web lee vistas en vivo), era solo elasticsearch.
  #
  # Asi que en vez de afinar el cron se queda prendido mirando. Una pasada sin
  # scores nuevos son dos consultas, o sea que estar cada tres segundos no cuesta
  # nada. En el cron queda solo el --full de la madrugada.
  #
  # El comando entra por el caso comodin de docker/development/run.sh, que
  # ejecuta cualquier cosa que no sea uno de sus verbos conocidos.
  torii-indexer:
    # La ruta se resuelve contra el directorio del PROYECTO (la raiz del repo),
    # no contra este archivo.
    extends:
      file: compose.yaml
      service: php
    command: ["php", "/app/torii-index-scores.php", "--watch"]
    networks: [default, g0v0]
    restart: unless-stopped
    environment:
      DB_HOST: osu_api_mysql
      DB_USERNAME: toriiweb
      DB_PASSWORD: "${DB_PASSWORD}"
      TORII_SOURCE_SCHEMA: osu_api

  # Los de dusk tambien: php-dusk corre con APP_ENV=dusk.local y expone
  # /_dusk/login/{id}, que loguea como cualquier usuario sin contrasena.
  php-dusk:
    profiles: ["apagado"]

  notification-server-dusk:
    profiles: ["apagado"]

  # ----------------------------------------------------------------- la app --

  php:
    networks: [default, g0v0]
    environment:
      DB_HOST: osu_api_mysql
      DB_USERNAME: toriiweb
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_CONNECTION_STRING: "Server=osu_api_mysql;Database=osu;Uid=toriiweb;Pwd=${DB_PASSWORD};"
      # El esquema de g0v0 se llama osu_api en prod y torii en la maquina local.
      # Lo leen las vistas (generadas con ese nombre adentro) y la capa de
      # escritura de WriteThrough.
      TORII_SOURCE_SCHEMA: osu_api
      USER_ACHIEVEMENT_ICON_PREFIX: https://assets.ppy.sh/medals/web/
      # /__clockwork/latest publica la cookie de sesion del ultimo request.
      CLOCKWORK_ENABLE: "false"
      # Sin esto aparece la franja roja de "Evaluation instance of Torii running
      # on real server data" al pie de cada pagina. El default de config/osu.php
      # es true, o sea que basta con no declararlo para que salga, y va declarado
      # aca y no en el .env porque el .env no esta en el repo.
      IS_DEVELOPMENT_DEPLOY: "false"
      # Sin esto config/trustedproxy.php queda vacio y Laravel ignora todos los
      # X-Forwarded-*: veria http en vez de https y la ip del gateway de la
      # bridge en vez de la del usuario.
      TRUSTED_PROXIES: "172.31.0.0/24"
      # Torii no manda correo: no hay MAIL_HOST configurado en ningun lado y el
      # codigo de verificacion termina en el log del contenedor. Con la
      # verificacion prendida el que se loguea cae en la pantalla de "ingresa el
      # codigo" y no sale nunca, porque el codigo no le llega. A los
      # privilegiados (admin, gmt, bng, nat) les salta en cada sesion, asi que la
      # cuenta del que administra el lugar era justo la que quedaba afuera.
      #
      # Esto no apaga ningun control real: un codigo que solo puede leer el que
      # ya tiene acceso al servidor no verifica nada, nomas traba. Cuando haya
      # correo de verdad se saca esta linea y vuelve solo.
      TORII_SKIP_SESSION_VERIFICATION: "true"
      WIKI_USER: ShikkesoraSIM
      WIKI_REPOSITORY: torii-wiki
      WIKI_BRANCH: main

  job:
    networks: [default, g0v0]
    environment:
      DB_HOST: osu_api_mysql
      DB_USERNAME: toriiweb
      DB_PASSWORD: "${DB_PASSWORD}"
      TORII_SOURCE_SCHEMA: osu_api
      USER_ACHIEVEMENT_ICON_PREFIX: https://assets.ppy.sh/medals/web/
      WIKI_USER: ShikkesoraSIM
      WIKI_REPOSITORY: torii-wiki
      WIKI_BRANCH: main

  assets:
    networks: [default, g0v0]
    environment:
      DB_HOST: osu_api_mysql
      DB_USERNAME: toriiweb
      DB_PASSWORD: "${DB_PASSWORD}"
    # Los assets se compilan UNA vez con webpack en modo produccion y despues el
    # contenedor se apaga: no hace falta un watcher corriendo para siempre.
    #
    # OJO con el comando: docker/development/run.sh solo entiende assets, job,
    # migrate, octane, schedule, test y watch; cualquier otra cosa la ejecuta
    # tal cual. Y "assets" es `yarn dev`, que es el build de DESARROLLO. El de
    # produccion es `yarn prod`, que va por el caso comodin.
    #
    # Y no es opcional: run.sh hace que octane espere a que exista
    # public/assets/manifest.json antes de arrancar, o sea que sin este build php
    # no levanta nunca y se queda imprimiendo "waiting to start octane".
    command: ["yarn", "prod"]
    restart: "no"

  notification-server:
    networks: [default, g0v0]
    environment:
      DB_HOST: osu_api_mysql
      DB_USERNAME: toriiweb
      DB_PASSWORD: "${DB_PASSWORD}"
    # Es el unico servicio que corre en prod y declara depends_on db. Sin el
    # required: false compose levanta el mysql apagado igual: un depends_on le
    # gana al profile.
    depends_on:
      redis:
        condition: service_healthy
      db:
        required: false

  nginx:
    volumes:
      # Conf de prod: sin el server de dusk (nginx no bootea si php-dusk no
      # resuelve) y con los X-Forwarded reales hacia octane.
      - ./docker/production/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
    # OJO: el puerto NO va aca. "ports" es una lista y compose la MERGEA en vez
    # de reemplazarla, asi que quedarian las dos publicaciones y el contenedor no
    # arranca. Va por NGINX_PORT en el .env, que compose.yaml ya sustituye:
    #   NGINX_PORT=127.0.0.1:8090
    # (8090 y no 8080 porque 127.0.0.1:8080 ya lo tiene osu-iceberg-wiki-1)
    depends_on:
      php:
        condition: service_started
      notification-server:
        condition: service_started
      php-dusk:
        required: false
      notification-server-dusk:
        required: false

networks:
  # Subred fija para que TRUSTED_PROXIES sea deterministico. En prod ya estan
  # tomadas 172.17.0.0/16 (bridge), 172.18 (g0v0), 172.19 (bot) y 172.20
  # (iceberg); 172.31.0.0/24 esta libre.
  default:
    ipam:
      config:
        - subnet: 172.31.0.0/24

  # La red donde vive osu_api_mysql. Externa: la creo el compose de g0v0 y este
  # stack no la administra.
  g0v0:
    external: true
    name: g0v0-server_osu-network
