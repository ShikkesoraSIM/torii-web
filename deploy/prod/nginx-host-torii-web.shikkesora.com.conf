# Va en /etc/nginx/sites-available/torii-web.shikkesora.com del HOST, con un
# symlink desde sites-enabled/. Mismo patron que osu-iceberg.shikkesora.com:
# listen 80 (Caddy ya termino el TLS), proxy_pass a un puerto de loopback donde
# publica el contenedor.
#
# Puerto: 8090. NO 8080, que en prod ya lo tiene osu-iceberg-wiki-1
# (127.0.0.1:8080->80/tcp). 8090/8091/8092 verificados libres.

server {
    listen 80;
    server_name torii-web.shikkesora.com;

    # osu-web sube avatares, portadas de perfil y adjuntos de BBCode. El nginx
    # del contenedor tambien tiene 32m; los dos tienen que coincidir o el de
    # afuera corta antes.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        # Host se preserva: hace falta para CSRF y para el chequeo de origen de
        # Laravel. Las urls absolutas las arma con APP_URL, no con esto.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;

        # Hardcodeado como en osu-iceberg: la unica via de entrada a este
        # server block es Caddy por 443, asi que siempre es https.
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 300;
        proxy_send_timeout 300;
        proxy_connect_timeout 60;
    }

    # El feed de notificaciones es un websocket: buffering off y timeout largo.
    location = /home/notifications/feed {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $torii_connection_upgrade;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
    }
}
